# The gates that guard every path to production (BFD-33): lint, tests, conform.
stages:
  - gates

variables:
  GIT_DEPTH: 0

lint-and-test:
  stage: gates
  image: node:24.13.0
  cache:
    key: npm
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run format:check
    - npm run test:run

conform:
  stage: gates
  image: golang:1.25.8
  script:
    - '"$(go -C tools tool -n bfd)" conform'
