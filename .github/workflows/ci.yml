# The gates that guard every path to production (BFD-33): lint, tests, conform.
name: ci

on:
  push:
    branches: ['master', 'release/**']
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'tools/go.mod'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:run
      # conform judges releases against master's first-parent line, so master
      # must exist as a local branch; checkout creates only the one it built.
      - run: git show-ref --verify --quiet refs/heads/master || git branch master origin/master
      # bfd is pinned in tools/go.mod; it runs from the repo root.
      - run: '"$(go -C tools tool -n bfd)" conform'
